name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test import of main modules
      run: |
        # Basic smoke test - ensure main modules can be imported
        python -c "import sys; print('Python version:', sys.version)"
        python -c "try: import app; print('✅ app.py imports successfully')" || echo "⚠️  app.py has import issues"
        python -c "try: import config; print('✅ config.py imports successfully')" || echo "⚠️  config.py has import issues"
    
    - name: Check project structure
      run: |
        echo "📁 Project structure:"
        find . -name "*.py" -type f | head -10
        echo "📄 Key files present:"
        ls -la app.py 2>/dev/null && echo "✅ app.py" || echo "❌ app.py missing"
        ls -la requirements.txt 2>/dev/null && echo "✅ requirements.txt" || echo "❌ requirements.txt missing"
        ls -la templates/index.html 2>/dev/null && echo "✅ templates/index.html" || echo "❌ templates/index.html missing"